services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: continuity-ch
    ports:
      # 8123 is the HTTP interface. mcp-clickhouse connects over HTTP (8123/8443),
      # not the native TCP protocol, so this port is the one that matters.
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: continuity
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: continuity_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch_data:/var/lib/clickhouse
      # Cache budgets sized for this container rather than for a large dedicated
      # server -- see the file's own comment. Without it, ClickHouse's default caches
      # are permitted 23+ GiB against a 5.97 GiB memory cap, and queries get stopped
      # by OvercommitTracker at random once the caches fill.
      - ./docker/clickhouse-caches.xml:/etc/clickhouse-server/config.d/caches.xml:ro
      # A per-query ceiling, so a runaway query fails by itself instead of the server
      # stopping an unrelated one. Goes in users.d, not config.d: max_memory_usage is a
      # profile setting and is ignored entirely if placed in the server config.
      - ./docker/clickhouse-query-limits.xml:/etc/clickhouse-server/users.d/query-limits.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ch_data:
