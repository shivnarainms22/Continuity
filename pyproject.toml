[project]
name = "continuity"
version = "0.1.0"
description = "Agentic incident investigation for streaming video quality of experience"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=0.8",
    "mcp-clickhouse>=0.4.1",
    # mcp MUST stay below 2.0. fastmcp 2.14 (a mcp-clickhouse dependency) declares
    # "mcp>=1.24.0" with no upper bound, but mcp 2.0.0 renamed McpError -> MCPError,
    # so fastmcp fails at import. The client-side API we use (ClientSession,
    # StdioServerParameters, stdio_client) is identical across 1.x.
    "mcp>=1.24,<2.0",
    "numpy>=2.1",
    "pydantic>=2.9",
    # fastmcp (a mcp-clickhouse dependency) imports pydantic_settings but does not
    # declare it, so the MCP server crashes on startup without this. The failure is
    # opaque from the client side -- it surfaces only as "Connection closed".
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "google-adk[mcp]>=2.6",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

# NOTE ON AI DEPENDENCIES
# The Agentic Cinema hackathon rules permit exactly these AI packages:
#   google-adk, google-genai, google-generativeai, google-cloud-aiplatform
# and prohibit AI models, agent frameworks and AI APIs from every other vendor.
# Google packages are added in sub-project 3. No other vendor's AI SDK may ever
# appear in this file.

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Upper-bounded on purpose. ruff's FORMATTER changes between minors -- 0.16 joins
    # implicit string concatenations that earlier versions left split -- so an unbounded
    # spec means `uv run ruff format .` produces a different result depending on when you
    # last resolved, and `ruff format --check` fails on a repo nobody touched. This was
    # already costing churn: a routine format run rewrote 16 untouched files.
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run so the module-scoped mcp-clickhouse session can be
# shared. Spawning a server per test costs ~20s each in first-connection setup.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires a running ClickHouse (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuity"]
